name: macOS Apple Silicon release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config qt@6

      - name: Build OpenSSL for arm64
        working-directory: dep/openssl/openssl
        run: |
          ./Configure darwin64-arm64-cc no-shared
          make -j"$(sysctl -n hw.ncpu)"

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUSE_SYSTEM_OPENSSL=OFF \
            -DUSE_SYSTEM_LIBSSH2=OFF \
            -DUSE_SYSTEM_QT=OFF \
            -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build/release --parallel

      - name: Package DMG
        run: cmake --build build/release --target package

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gittyup-macos-arm64-dmg
          path: build/release/pack/*.dmg
          if-no-files-found: error
